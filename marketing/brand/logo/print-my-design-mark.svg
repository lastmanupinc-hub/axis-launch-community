<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Print My Design">
  <title>Print My Design</title>
  <defs>
    <linearGradient id="pmd-signature" gradientUnits="userSpaceOnUse"
                    x1="112" y1="112" x2="400" y2="400">
      <stop offset="0%"   stop-color="#F2A93B"/>
      <stop offset="44%"  stop-color="#EE9C38"/>
      <stop offset="60%"  stop-color="#A67A55"/>
      <stop offset="76%"  stop-color="#3576B2"/>
      <stop offset="100%" stop-color="#2A639E"/>
    </linearGradient>
    <mask id="pmd-ring">
      <rect x="101" y="101" width="310" height="310" rx="104" ry="104"
            transform="rotate(45 256 256)" fill="#fff"/>
      <rect x="180" y="180" width="152" height="152" rx="34" ry="34"
            transform="rotate(45 256 256)" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#pmd-signature)" mask="url(#pmd-ring)"/>
</svg>
