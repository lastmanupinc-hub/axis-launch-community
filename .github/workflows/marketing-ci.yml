name: Marketing CI

on:
  pull_request:
    paths: ["marketing/**", ".github/workflows/*.yml"]
  push:
    branches: [main]
    paths: ["marketing/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: marketing/requirements.txt
      - run: pip install -r marketing/requirements.txt

      - name: Compliance guard tests
        run: python3 marketing/tests/test_guards.py

      - name: Source harvesting tests
        run: python3 marketing/tests/test_sources.py

      - name: Config integrity
        run: python3 marketing/tests/test_config.py

      - name: Calendar covers a whole year and every day builds
        run: python3 marketing/tests/test_calendar.py

      - name: Catalogue importer round-trips
        run: python3 marketing/tests/test_importer.py

      - name: Unattended operation fails closed
        run: python3 marketing/tests/test_autonomy.py

      - name: Builders stay inside what the product can honour
        env:
          PMD_POSTAL_ADDRESS: "CI placeholder, 1 Example Street, Example City"
        run: python3 marketing/tests/test_builders.py

      - name: Ad set builds clean for the next 14 days
        run: python3 marketing/scripts/build_ads.py --days 14 --check

      - name: Newsletter builds offline
        env:
          PMD_POSTAL_ADDRESS: "CI placeholder, 1 Example Street, Example City"
        run: python3 marketing/scripts/build_newsletter.py --offline --no-write
